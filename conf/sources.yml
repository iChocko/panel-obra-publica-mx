# Patrones de URL y parámetros de red para el descubrimiento de datos abiertos
# de Obra Pública Abierta (OPA), SHCP. Fase 0 — reconocimiento.
#
# Ver viabilidad_tecnica y ARQUITECTURA-panel-obra-publica-mx.md para el contexto completo.

red:
  # Transparencia, no evasión: identificable, con propósito y contacto.
  user_agent: "panel-obra-publica-mx/0.1 (investigacion de datos abiertos; github.com/iChocko)"
  rate_limit_segundos_shcp: 2.0
  max_reintentos: 3
  backoff_base_segundos: 1.0
  timeout_segundos: 20.0
  # Usado como fallback cuando HEAD no responde bien (ver discovery.py).
  head_range_bytes: "bytes=0-2047"
  bytes_maximos_get_range: 2048

anios:
  desde: 2015
  hasta: 2026

# --- Fuente 1: URLs vivas ------------------------------------------------
fuente_viva:
  base_url: "https://www.transparenciapresupuestaria.gob.mx"
  # Placeholders soportados: {anio}, {n} (1..4), {ord} (1er..4to), {v} (2,3).
  #
  # Fase 1 (2026-08-07/08): el hueco 2022-2026 que dejó Fase 0 NO era descontinuación --
  # el portal migró a una SPA (Next.js, /work/models/PTP/NPTP/) y renombró los archivos
  # trimestrales, en la MISMA carpeta /DatosAbiertos/OPA/{anio}/ que ya se probaba. Las 4
  # líneas nuevas de abajo son ese patrón, confirmadas con GET real (no solo status) y
  # esquema de columnas idéntico al ya documentado en reports/esquemas.md, para los 17
  # trimestres 2022-2026T1. "Concluido(s)OPA" alterna singular/plural sin regla clara por
  # año -- se prueban ambas formas a propósito, no es redundancia. El propio portal expone
  # además un manifiesto JSON con los enlaces vigentes (ver auxiliares abajo): confirma el
  # patrón pero solo lista el trimestre más reciente por archivo, así que no reemplaza el
  # sondeo histórico trimestre a trimestre.
  patrones:
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/proyectos_opa.csv"
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/proyectos_opa.xlsx"
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/proyectos_opa_0{n}t{anio}.csv"
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/proyectos_opa_0{n}t{anio}.xlsx"
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/reporteOPA{ord}Trimestre.xlsx"
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/reporteOPA{ord}Trimestre_V{v}.xlsx"
    - "/work/models/PTP/OPA/{anio}/Proyectos_OPA.csv"  # patrón antiguo
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/ConsolidadoOPA{ord}Trimestre{anio}.csv"  # patrón nuevo (Fase 1)
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/SeguimientoOPA{ord}Trimestre{anio}.csv"  # patrón nuevo (Fase 1)
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/ConcluidosOPA{ord}Trimestre{anio}.csv"  # patrón nuevo (Fase 1), plural
    - "/work/models/PTP/DatosAbiertos/OPA/{anio}/ConcluidoOPA{ord}Trimestre{anio}.csv"  # patrón nuevo (Fase 1), singular
  trimestre_n: [1, 2, 3, 4]
  trimestre_ord: ["1er", "2do", "3er", "4to"]
  version_v: [2, 3]
  # Casos especiales (Fase 1b, 2026-08-08): URLs exactas de un solo año/trimestre con
  # nomenclatura irregular que no sigue ningún patrón parametrizable de arriba -- no se
  # generan por producto cartesiano {anio}x{ord}, se prueban tal cual. Encontradas siguiendo
  # el manifiesto oficial del portal (row-down-opa.json, ver auxiliares), que etiqueta cada
  # URL con su trimestre en texto plano -- PERO esa etiqueta no es confiable sin verificar el
  # contenido: "opa_trimestral.csv" venía etiquetado "Primer trimestre 2019" y en realidad
  # tiene CICLO=2018 en el 100% de sus filas (ver auxiliares abajo, no se usa como caso
  # especial). OPAPrimerTrimestre2019.csv sí se verificó con CICLO=2019 en el 100% de sus
  # filas -- ese es el T1 2019 real. El archivo de 2020 cubre T3 y T4 juntos en un solo CSV,
  # sin columna que distinga trimestre por fila (verificado, ver README) -- se repite la misma
  # URL con trimestre 3 y 4 asumiendo que es el corte combinado oficial de ese periodo, no un
  # error nuestro de conteo.
  casos_especiales:
    - url: "/work/models/PTP/DatosAbiertos/OPA/2019/OPAPrimerTrimestre2019.csv"
      anio: 2019
      trimestre: 1
    - url: "/work/models/PTP/DatosAbiertos/OPA/2019/OPASegundoTrimestre2019.csv"
      anio: 2019
      trimestre: 2
    - url: "/work/models/PTP/DatosAbiertos/OPA/2019/OPATercerTrimestre2019.csv"  # el manifiesto trae un typo ("OPATerceTrimestre2019.csv", sin la "r") que da 404 -- esta es la forma real
      anio: 2019
      trimestre: 3
    - url: "/work/models/PTP/DatosAbiertos/OPA/2019/OPA4toTrimestre2019.csv"
      anio: 2019
      trimestre: 4
    - url: "/work/models/PTP/DatosAbiertos/OPA/2020/OPA3er4toTrimestre2020.csv"
      anio: 2020
      trimestre: 3
    - url: "/work/models/PTP/DatosAbiertos/OPA/2020/OPA3er4toTrimestre2020.csv"
      anio: 2020
      trimestre: 4
    # Encontrado al preparar Bronze (2026-08-08): una captura de Wayback sin clasificar
    # (mimetype text/csv, filtrada como "no_reconocido" porque el nombre no coincidía con
    # ningún patrón conocido) resultó ser 2016 Q3 real -- esquema viejo (CVE_PPI), ANIO=2016
    # en 99% de las 3616 filas. Se probaron 1t/2t/4t del mismo año y de 2017/2018 con esta
    # misma convención -- todas 404, no es un patrón amplio, es un archivo suelto.
    - url: "/work/models/PTP/DatosAbiertos/OPA/2016/Proyectos_OPA_3t.csv"
      anio: 2016
      trimestre: 3
  # Se descargan completos si responden 200 (excepción explícita a "solo metadatos").
  auxiliares:
    - "/work/models/PTP/DatosAbiertos/Diccionarios/diccionario_opa.xlsx"
    - "/work/models/PTP/DatosAbiertos/Metadatos/catalogos.xlsx"
    - "/work/models/PTP/OPA/app.xlsx"
    # Manifiesto oficial autogenerado por el portal (Fase 1): lista sus propios enlaces de
    # descarga vigentes. Útil como referencia cruzada, no como fuente única -- solo apunta
    # al trimestre más reciente de cada archivo, no al histórico completo.
    - "/work/models/PTP/NPTP/api/page-config/opa/row-down-opa.json"
    # Complementarios (Fase 1b): no llenan un hueco trimestral, pero son datos reales del
    # mismo dataset OPA que vale la pena preservar.
    - "/work/models/PTP/DatosAbiertos/OPA/2020/ConcluidoOPA3er4toTrimestre2020.csv"
    - "/work/models/PTP/DatosAbiertos/OPA/2019/opa_concluidos.csv"  # concluidos acumulado desde 2015
    # Verificado por contenido (Fase 1b) como CICLO=2018, no 2019 T1 pese a que el manifiesto
    # oficial lo etiqueta "Primer trimestre 2019" y vive en la carpeta /2019/. Publicado
    # 2019-03-07 (Last-Modified) -- posible cierre de un trimestre de 2018 (¿T4?), sin
    # confirmar a nivel de fila. No se usa para llenar ninguna celda de la matriz; se conserva
    # como dato real archivable y pista para investigar en Fase 2.
    - "/work/models/PTP/DatosAbiertos/OPA/2019/opa_trimestral.csv"

# --- Fuente 2: espejos ----------------------------------------------------
fuente_espejo:
  ckan_base: "https://www.datos.gob.mx/api/3/action"
  # id histórico documentado en el dictamen de viabilidad (a confirmar: puede
  # ya no existir en el catálogo actual — ver discovery.jsonl).
  ckan_package_id: "56b98e14-41ba-4edd-b8a8-c96d5008b071"
  ckan_busqueda_respaldo: "Obra Pública Abierta"
  datamx_io: "https://datamx.io"

# --- Fuente 3: Wayback Machine (CDX API) -----------------------------------
fuente_wayback:
  cdx_base: "http://web.archive.org/cdx/search/cdx"
  prefijos:
    - "transparenciapresupuestaria.gob.mx/work/models/PTP/DatosAbiertos/OPA"
    - "transparenciapresupuestaria.gob.mx/work/models/PTP/OPA"
  match_type: "prefix"
  collapse: "digest"
  campos: ["original", "timestamp", "statuscode", "mimetype", "length", "digest"]
  filtro_status: "statuscode:200"
  filtro_mimetype_excluir: "!mimetype:text/html"
