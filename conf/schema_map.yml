# schema_map.yml -- mapeo explícito y auditable de columnas históricas a nombres canónicos.
# Ver ARQUITECTURA-panel-obra-publica-mx.md secciones 4.2 y 5.3.
#
# Cada entrada de "esquemas" está indexada por header_hash -- el hash del conjunto de columnas
# crudas de un snapshot, calculado por src/opa/manifest.py:calcular_header_hash() y ya
# registrado por snapshot en data/manifest.jsonl. Un header_hash que NO aparece aquí es un
# esquema nuevo no visto: el pipeline (normalize.py, todavía no escrito) debe fallar
# ruidosamente, no adivinar el mapeo -- ver la regla de la sección 5.3.
#
# Construido en Fase 2 (2026-08-08) inspeccionando columna por columna los 128 archivos
# bronze reales archivados en Fase 1 -- no la muestra de 3 archivos de Fase 0. Se encontraron
# 11 esquemas reales distintos (más 3 snapshots corruptos en la fuente, ver el bloque final).
#
# Convención de confianza en cada mapeo de columna:
#   (sin marca)  -- coincide de nombre o de posición con la columna moderna equivalente.
#   [inferido]   -- coincidencia semántica razonada pero no confirmada contra documentación
#                   oficial de la SHCP. Revisar antes de usar en un cálculo que dependa de ello.
#   [bug_fuente] -- la fuente reutilizó un nombre de columna ya usado (pandas le agrega ".1"
#                   al leerlo) o etiquetó mal una columna. El mapeo corrige la posición real,
#                   no el nombre literal que trae el archivo.

columnas_canonicas:
  # Núcleo compartido por (casi) todos los esquemas -- lo que necesita fct_ppi_observacion.
  cve_cartera: "Clave de cartera del PPI. Antes de 2019 la columna se llama CVE_PPI. Grano del panel."
  nombre_ppi: "Nombre del programa/proyecto de inversión."
  id_ramo: "Código del ramo presupuestario."
  descripcion_ramo: "Nombre del ramo presupuestario."
  id_ur: "Código de la unidad responsable."
  descripcion_ur: "Nombre de la unidad responsable."
  descripcion_tipo_ppi: "Tipo de PPI (categoría)."
  descripcion_ppi: "Descripción larga del proyecto."
  localizacion: "Localización textual libre."
  id_entidad_federativa: "Clave de entidad federativa (INEGI)."
  entidad_federativa: "Nombre de la entidad federativa."
  latitud: "Latitud del proyecto. OJO: en el esquema viejo (2015-2018) '0' es un centinela
    real de 'sin coordenadas' -- 48.6% de LATITUD_INICIAL en 2015 es literalmente 0
    (verificado). normalize.py lo convierte a nulo antes de validar; no tratarlo como (0,0)
    real en ningún cálculo aguas abajo."
  longitud: "Longitud del proyecto. Mismo centinela '0' que latitud, ver esa nota."
  fecha_inicio_cal_ff: "Fecha de inicio (calendario físico-financiero)."
  fecha_fin_cal_ff: "Fecha de fin (calendario físico-financiero)."
  anios_he: "Años de horizonte de ejecución declarados."
  nombre_admin: "Nombre del responsable administrativo del PPI."
  apellido_paterno_admin: "Apellido paterno del responsable."
  apellido_materno_admin: "Apellido materno del responsable."
  cargo_admin: "Cargo del responsable."
  mail_admin: "Correo del responsable."
  mail_alterno_admin: "Correo alterno del responsable (solo esquema moderno)."
  telefono_admin: "Teléfono del responsable."
  extension_admin: "Extensión telefónica (solo esquema moderno)."
  meta_fisica: "Meta física declarada, texto libre."
  beneficios_esperados: "Beneficios esperados, texto libre."
  id_ppi: "Identificador interno del PPI (no confundir con cve_cartera)."
  ppef: "Monto en el Proyecto de Presupuesto de Egresos de la Federación."
  pef: "Monto en el Presupuesto de Egresos de la Federación aprobado."
  aprobado: "Monto aprobado."
  modificado: "Monto modificado (presupuesto vigente)."
  ejercido: "Monto ejercido."
  avance_fisico: "Porcentaje de avance físico declarado."
  monto_total_inversion: "Monto total de inversión del PPI."
  monto_operacion_mantenimiento: "Monto de operación y mantenimiento (solo esquema moderno)."
  otros_costos: "Otros costos (solo esquema moderno)."
  costo_total_inversion: "Costo total de inversión. En el esquema viejo es COSTO_TOTAL_PPI."
  anio: "Año declarado por el proyecto -- OJO: ~20% de filas lo traen vacío incluso en el
    esquema moderno (verificado en Fase 2 sobre datos reales); no asumir siempre presente.
    ciclo suele estar poblado cuando anio no lo está."
  fiscal: "Fuente de recursos: fiscal (solo esquema moderno)."
  propio: "Fuente de recursos: propios (solo esquema moderno)."
  estatal: "Fuente de recursos: estatales. Antes de 2019 es RECURSOS_ESTATALES."
  municipal: "Fuente de recursos: municipales. Antes de 2019 es RECURSOS_MUNICIPALES."
  privada: "Fuente de recursos: privados. Antes de 2019 es RECURSOS_PRIVADOS/PRIVADOS."
  fideicomiso: "Fuente de recursos: fideicomiso."
  otros: "Fuente de recursos: otros (solo esquema moderno)."
  ciclo: "Ciclo/ejercicio fiscal del corte. Más completo que anio en la práctica."
  estatus_operacion: "Estatus del PPI (vigente/concluido/suspendido/...). Solo esquema moderno;
    el esquema viejo usa fase con un vocabulario distinto, sin normalizar todavía."

  # Solo en el esquema viejo (2015-2018, CVE_PPI) -- sin equivalente directo en el moderno.
  fecha_inicio_cal_fiscal: "Fecha de inicio, calendario fiscal (distinta de fecha_inicio_cal_ff)."
  fecha_fin_cal_fiscal: "Fecha de fin, calendario fiscal."
  grupo_funcional: "Clasificación funcional del gasto (grupo)."
  funcion: "Clasificación funcional del gasto (función)."
  total_gasto_operacion_he: "Gasto de operación en el horizonte de ejecución."
  total_gasto_no_considerado: "Gasto no considerado en el costo total."
  monto_asignacion_actual: "Monto de asignación actual (visto solo en 2015)."
  aprobado_pef_2017: "Monto aprobado en el PEF 2017 (columna de un solo ejercicio, vista en
    snapshots de 2016-2017; no es un campo recurrente, es un artefacto de esa publicación)."
  calendario_fiscal_del_ciclo: "Calendario fiscal del ciclo (codificado, sin decodificar)."
  clasificacion_ciudadana: "Clave de clasificación ciudadana del gasto (visto solo en 2016)."
  descripcion_clasificacion_ciudadana: "Descripción de la clasificación ciudadana (2016-2018)."
  tipo_proyecto: "Tipo de proyecto, texto libre (visto en 2015 y algunos snapshots de 2016)."
  fase: "Fase del PPI en el esquema viejo/transicional (2017-2018) -- vocabulario distinto a
    estatus_operacion del esquema moderno, sin normalizar/unificar todavía (Fase 3)."

