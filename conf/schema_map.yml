  - archivo_bronze: opa_2024_1_0923b83f.csv
    url: https://www.transparenciapresupuestaria.gob.mx/work/models/PTP/DatosAbiertos/OPA/2024/ConsolidadoOPA1erTrimestre2024.csv
    razon: >
      El servidor sirve un binario OLE2 (firma de Excel .xls antiguo) con extensión .csv y
      Content-Type text/csv. El archivo está truncado en la fuente misma -- el
      Content-Length del servidor (1,466,368 bytes) coincide exactamente con lo descargado,
      no es un problema de nuestra descarga, y xlrd confirma "Workbook stream length (2834670
      bytes) > file data size (1465856 bytes)". Sin captura alterna en Wayback (verificado
      2026-08-08). corte_declarado sigue siendo {anio: 2024, trimestre: 1} en el manifiesto
      -- vivo según discovery.py (200, Content-Type correcto), pero el contenido no es
      usable. Ver README para el detalle completo.
